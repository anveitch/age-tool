<?xml version="1.0" encoding="UTF-8"?>
<!-- age-tool app icon: a padlock carrying a lowercase "a" (for age), on a
     dark slate tile with a light edge so it stands out on dark themes -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tile -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="#1e293b" stroke="#64748b" stroke-width="8"/>
  <!-- Shackle -->
  <path d="M88 112 V88 A40 40 0 0 1 168 88 V112" fill="none" stroke="#ffb347" stroke-width="22" stroke-linecap="round"/>
  <!-- Lock body -->
  <rect x="58" y="104" width="140" height="116" rx="22" fill="#f8fafc"/>
  <!-- The "a": a ring with a stem on its right -->
  <circle cx="122" cy="164" r="26" fill="none" stroke="#1e293b" stroke-width="16"/>
  <rect x="140" y="134" width="16" height="58" rx="7" fill="#1e293b"/>
</svg>
